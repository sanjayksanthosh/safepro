# Render blueprint — deploy Safe-Pro on the free tier.
# Sign up at render.com → New + → Blueprint → select the safepro repo.
# It will build the Dockerfile and provision the env vars below.
services:
  - type: web
    name: safepro
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      # Sequential scraping to fit the free tier's 512MB RAM.
      # Bump to 3 on a bigger instance for ~2x faster scrapes.
      - key: SAFEPRO_MAX_WORKERS
        value: "1"
